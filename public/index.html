<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TarkovTracker Status</title>
    <link
      rel="icon"
      type="image/webp"
      href="https://tarkovtracker.org/img/logos/tarkovtrackerlogo-light.webp"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="ambient"></div>
    <header class="hero">
      <img
        class="hero-logo"
        src="https://tarkovtracker.org/img/logos/tarkovtrackerlogo-light.webp"
        alt="TarkovTracker logo"
        width="96"
        height="96"
      />
      <h1>Service Status</h1>
      <p class="subtitle">
        Live checks for TarkovTracker.org, the bug report website, and the
        monitoring service. If a check fails, the service is flagged immediately.
      </p>
      <div class="timestamp" id="last-updated">Last check: --</div>
    </header>

    <main class="layout">
      <section class="history-header">
        <h2>Last 7 days of incidents</h2>
        <p>Counts of failed checks grouped per day.</p>
      </section>
      
      <section class="status-history-grid" id="status-history-grid"></section>
    </main>

    <footer class="footer">
      <span class="legend good"></span> Operational
      <span class="legend warn"></span> Issue detected
      <span class="legend checking"></span> Checking
    </footer>

    <script src="app.js"></script>
  </body>
</html>
